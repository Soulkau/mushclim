[package]
edition = "2024"
name = "mushclim"
rust-version = "1.88"
version = "0.1.0"

[lib]
test = false
bench = false

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
panic = "abort"
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

[dependencies]
ivy = {git = "https://github.com/Soulkau/Ivy.git", tag = "v0.2.2"}
talky = {git = "https://github.com/Soulkau/Talky.git", tag="v0.1" , features = ["devices", "macros"]}
# esp-specific


# embedded-abstractions
embedded-io = "0.7.0"
embedded-io-async = "0.7.0"
embedded-time = "0.12.1"
embedded-storage = "0.3.1"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns", "dhcpv4"] }
embassy-executor = { version = "0.9.0", features = [] }
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
embassy-sync = "0.7.2"
embassy-embedded-hal = "0.6.0"
embedded-hal-async = "1.0.0"
bt-hci = "0.6.0"
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "multicast", "proto-dhcpv4", "proto-dns", "proto-ipv4", "socket-dns", "socket-tcp", "socket-udp"] }
critical-section = "1.2.0"
static_cell = "2.1.1"
heapless = { version = "0.9.2", features = ["serde"] }
nb = "1.1.0"
trouble-host = "0.5.0"
sequential-storage = "7.2.0"

# others

driverse = { git="https://github.com/Soulkau/Driverse.git" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
log = { version = "0.4.29" }
anyhow = { version = "1.0.100", default-features = false }
ulid = { version = "1.2.1", default-features = false }
jiff = { version = "0.2.15", default-features = false, features = ["alloc", "serde", "tzdb-bundle-platform"] }
async-trait = "0.1.89"
rand = { version = "0.8.0", default-features = false, features = ["alloc", "small_rng"] }
async-oneshot = "0.5.9"
tracing = { version = "0.1.44", default-features = false, features = ["log"] }
sha2 = { version = "0.10.9", default-features = false }
postcard = "1.1.3"
thiserror = { version = "2.0.18", default-features = false }
embedded-tls = { git = "https://github.com/drogue-iot/embedded-tls", rev = "426f327", default-features = false }
embedded-hal = "1.0.0"
embedded-nal-async = "0.9.0"
# rapid = { path = "/home/soulkau/Projects/rapid" }
