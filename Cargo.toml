[package]
edition = "2024"
name = "mushclim"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
test = false
bench = false
name = "mushclim"
path = "./src/bin/main.rs"

[dependencies]
ivy = {path = "../ivy"}
talky = {path = "../talky", features = ["devices", "macros"]}
# esp-specific

esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal", rev = "e7b663af699c4b4e387dadc7e1ea0d1e89621854", features = ["esp32c6"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal", rev = "e7b663af699c4b4e387dadc7e1ea0d1e89621854", features = ["esp32c6", "unstable"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal", rev = "e7b663af699c4b4e387dadc7e1ea0d1e89621854", features = ["embassy", "esp-alloc", "esp-radio", "esp32c6"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal", rev = "e7b663af699c4b4e387dadc7e1ea0d1e89621854", features = ["esp32c6", "log-04"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal", rev = "e7b663af699c4b4e387dadc7e1ea0d1e89621854", features = ["ble", "coex", "esp-alloc", "esp32c6", "smoltcp", "unstable", "wifi"] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal", rev = "e7b663af699c4b4e387dadc7e1ea0d1e89621854", features = ["esp32c6"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal", rev = "e7b663af699c4b4e387dadc7e1ea0d1e89621854" }

# embedded-abstractions
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-time = "0.12.1"
embedded-storage = "0.3.1"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns", "dhcpv4"] }
embassy-executor = { version = "0.9.0", features = [] }
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-embedded-hal = "0.6.0"
bt-hci = "0.6.0"
smoltcp = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "multicast", "proto-dhcpv4", "proto-dns", "proto-ipv4", "socket-dns", "socket-icmp", "socket-raw", "socket-tcp", "socket-udp"] }
critical-section = "1.2.0"
static_cell = "2.1.1"
heapless = { version = "0.9.2", features = ["serde"] }
nb = "1.1.0"
trouble-host = "0.5.0"
sequential-storage = "7.2.0"

# others

driverse = { git="https://github.com/Soulkau/Driverse.git" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
log = { version = "0.4.29" }
anyhow = { version = "1.0.100", default-features = false }
ulid = { version = "1.2.1", default-features = false }
jiff = { version = "0.2.15", default-features = false, features = ["alloc", "serde", "tzdb-bundle-platform"] }
async-trait = "0.1.89"
rand = { version = "0.8.0", default-features = false, features = ["alloc", "small_rng"] }
async-oneshot = "0.5.9"
tracing = { version = "0.1.44", default-features = false, features = ["log"] }
sha2 = { version = "0.10.9", default-features = false }
postcard = "1.1.3"
thiserror = { version = "2.0.18", default-features = false }
embedded-tls = { git = "https://github.com/drogue-iot/embedded-tls", rev = "426f327", default-features = false }
embedded-hal = "1.0.0"
embedded-nal-async = "0.9.0"
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal", rev = "e7b663af699c4b4e387dadc7e1ea0d1e89621854",features = ["esp32c6", "println", "panic-handler"]}
# rapid = { path = "/home/soulkau/Projects/rapid" }


[lib]
test = false
bench = false

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
